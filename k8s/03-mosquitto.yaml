apiVersion: apps/v1
kind: Deployment
metadata:
  name: calidad-mqtt
  namespace: aira
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: calidad-mqtt
  template:
    metadata:
      labels:
        app: calidad-mqtt
    spec:
      securityContext:
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: initialize-dynamic-security
          image: eclipse-mosquitto:2.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ ! -s /mosquitto/data/dynamic-security.json ]; then
                test -n "$MQTT_INTERNAL_PASSWORD"
                mosquitto_ctrl dynsec init /mosquitto/data/dynamic-security.json api "$MQTT_INTERNAL_PASSWORD"
              fi
              chown 1883:1883 /mosquitto/data/dynamic-security.json
              chmod 0600 /mosquitto/data/dynamic-security.json
          env:
            - name: MQTT_INTERNAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: calidad-secrets
                  key: MQTT_INTERNAL_PASSWORD
          securityContext:
            runAsUser: 1883
            runAsGroup: 1883
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 50m
          volumeMounts:
            - name: mqtt-data
              mountPath: /mosquitto/data
              subPath: data
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
            - name: websockets
              containerPort: 9001
              protocol: TCP
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: mqtt-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
            - name: mqtt-data
              mountPath: /mosquitto/data
              subPath: data
      volumes:
        - name: mqtt-config
          configMap:
            name: calidad-mqtt-config
            items:
              - key: mosquitto.conf
                path: mosquitto.conf
        - name: mqtt-data
          persistentVolumeClaim:
            claimName: calidad-mqtt-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: calidad-mqtt
  namespace: aira
spec:
  type: ClusterIP
  selector:
    app: calidad-mqtt
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
    - name: websockets
      port: 9001
      targetPort: websockets
      protocol: TCP
