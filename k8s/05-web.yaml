apiVersion: apps/v1
kind: Deployment
metadata:
  name: calidad-web
  namespace: aira
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calidad-web
  template:
    metadata:
      labels:
        app: calidad-web
    spec:
      initContainers:
        - name: publish-static-files
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - >-
              mkdir -p /www/assets && cp /core/index.html /www/index.html &&
              for file in /core/asset__* /js/asset__* /main-js/asset__*; do
                [ -f "$file" ] || continue;
                name=${file##*/asset__};
                cp "$file" "/www/assets/$name";
              done
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 64Mi
              cpu: 100m
          volumeMounts:
            - name: web-core
              mountPath: /core
              readOnly: true
            - name: web-assets
              mountPath: /js
              readOnly: true
            - name: web-main-js
              mountPath: /main-js
              readOnly: true
            - name: html-root
              mountPath: /www
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: web-core
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            - name: html-root
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: web-core
          configMap:
            name: calidad-web-core
            defaultMode: 0444
        - name: web-assets
          configMap:
            name: calidad-web-assets
        - name: web-main-js
          configMap:
            name: calidad-web-main-js
            defaultMode: 0444
        - name: html-root
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: calidad-web
  namespace: aira
spec:
  type: ClusterIP
  selector:
    app: calidad-web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
